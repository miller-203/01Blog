<header class="app-header">
    <div class="container-fluid">
        <div class="row align-items-center py-1 justify-content-between">
            <!-- Logo Section -->
            <div class="col-auto">
                <a routerLink="/home" class="text-decoration-none">
                    <div class="d-flex align-items-center logo-container">
                        <div class="logo-circle d-flex align-items-center justify-content-center">
                            <div class="logo-inner"></div>
                        </div>
                        <h1 class="logo-text mb-0">1Blog</h1>
                    </div>
                </a>
            </div>

            <!-- Actions Section -->
            <div class="col-auto">
                <div class="d-flex align-items-center gap-2">
                    <!-- Hamburger Menu for Mobile/Tablet -->
                    <button class="btn-hamburger d-lg-none" type="button" (click)="onToggleSidebar()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <g fill="none" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 12h.009m3.995 0h.01m3.977 0H16" />
                                <path stroke-width="1.5"
                                    d="M2 12c0-4.714 0-7.071 1.464-8.536C4.93 2 7.286 2 12 2c4.714 0 7.071 0 8.535 1.464C22 4.93 22 7.286 22 12c0 4.714 0 7.071-1.465 8.535C19.072 22 16.714 22 12 22s-7.071 0-8.536-1.465C2 19.072 2 16.714 2 12Z" />
                            </g>
                        </svg>
                    </button>

                    <!-- Notifications -->
                    <a routerLink="/notifications" class="text-decoration-none">
                        <button class="btn-notifications position-relative" type="button" routerLink="/notifications">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path
                                        d="M18.75 9.71v-.705C18.75 5.136 15.726 2 12 2S5.25 5.136 5.25 9.005v.705a4.4 4.4 0 0 1-.692 2.375L3.45 13.81c-1.011 1.575-.239 3.716 1.52 4.214a25.775 25.775 0 0 0 14.06 0c1.759-.498 2.531-2.639 1.52-4.213l-1.108-1.725a4.4 4.4 0 0 1-.693-2.375Z" />
                                    <path stroke-linecap="round"
                                        d="M7.5 19c.655 1.748 2.422 3 4.5 3s3.845-1.252 4.5-3M12 6v4" />
                                </g>
                            </svg>
                            <span class="notification-dot" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
                        </button>
                    </a>

                    <!-- Create Post Button -->
                    <a routerLink="/create-post" class="text-decoration-none">
                        <button class="btn btn-create d-md-flex align-items-center" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M3 11c0-3.771 0-5.657 1.172-6.828C5.343 3 7.229 3 11 3h2c3.771 0 5.657 0 6.828 1.172C21 5.343 21 7.229 21 11v2c0 3.771 0 5.657-1.172 6.828C18.657 21 16.771 21 13 21h-2c-3.771 0-5.657 0-6.828-1.172C3 18.657 3 16.771 3 13z" />
                                    <path stroke-linecap="square" stroke-linejoin="round" d="M12 8v8m4-4H8" />
                                </g>
                            </svg>
                            New Post
                        </button>
                    </a>
                    <!-- Profile Dropdown -->
                    <div class="dropdown">
                        <button class="btn profile-btn d-flex align-items-center" type="button"
                            (click)="toggleDropdown()">
                            <div class="profile-avatar">
                                <img src="{{currentUser()?.avatarUrl}}"
                                    alt="Profile Avatar">
                            </div>
                            <span class="ms-2 d-none d-lg-inline profile-name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</span>
                            <i class="bi ms-2 d-none d-lg-inline" [class.bi-chevron-down]="!isOpen()"
                                [class.bi-chevron-up]="isOpen()"></i>
                        </button>

                        @if (isOpen()) {
                        <ul class="dropdown-menu">
                            <li>
                                <div class="dropdown-header">
                                    <strong>{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</strong>
                                    <div class="d-block text-muted">@{{ currentUser()?.username }}</div>
                                </div>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" routerLink="/privacy">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        class="mx-1">
                                        <g fill="none" stroke="currentColor" stroke-width="1.5">
                                            <path
                                                d="M3 10.417c0-3.198 0-4.797.378-5.335c.377-.537 1.88-1.052 4.887-2.081l.573-.196C10.405 2.268 11.188 2 12 2c.811 0 1.595.268 3.162.805l.573.196c3.007 1.029 4.51 1.544 4.887 2.081C21 5.62 21 7.22 21 10.417v1.574c0 5.638-4.239 8.375-6.899 9.536C13.38 21.842 13.02 22 12 22s-1.38-.158-2.101-.473C7.239 20.365 3 17.63 3 11.991v-1.574Z" />
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="m9.5 12.4l1.429 1.6l3.571-4" />
                                        </g>
                                    </svg>
                                    Privacy</a></li>
                            <li><a class="dropdown-item" routerLink="/about">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512"
                                        class="mx-1">
                                        <path fill="currentColor" fill-rule="evenodd"
                                            d="M256 42.667C138.18 42.667 42.667 138.179 42.667 256c0 117.82 95.513 213.334 213.333 213.334c117.822 0 213.334-95.513 213.334-213.334S373.822 42.667 256 42.667m0 384c-94.105 0-170.666-76.561-170.666-170.667S161.894 85.334 256 85.334c94.107 0 170.667 76.56 170.667 170.666S350.107 426.667 256 426.667m26.714-256c0 15.468-11.262 26.667-26.497 26.667c-15.851 0-26.837-11.2-26.837-26.963c0-15.15 11.283-26.37 26.837-26.37c15.235 0 26.497 11.22 26.497 26.666m-48 64h42.666v128h-42.666z" />
                                    </svg>About</a></li>
                            <li><a class="dropdown-item" routerLink="/settings">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        class="mx-1">
                                        <g fill="none" stroke="currentColor" stroke-width="1.5">
                                            <circle cx="12" cy="12" r="3" />
                                            <path
                                                d="M13.765 2.152C13.398 2 12.932 2 12 2c-.932 0-1.398 0-1.765.152a2 2 0 0 0-1.083 1.083c-.092.223-.129.484-.143.863a1.617 1.617 0 0 1-.79 1.353a1.617 1.617 0 0 1-1.567.008c-.336-.178-.579-.276-.82-.308a2 2 0 0 0-1.478.396C4.04 5.79 3.806 6.193 3.34 7c-.466.807-.7 1.21-.751 1.605a2 2 0 0 0 .396 1.479c.148.192.355.353.676.555c.473.297.777.803.777 1.361c0 .558-.304 1.064-.777 1.36c-.321.203-.529.364-.676.556a2 2 0 0 0-.396 1.479c.052.394.285.798.75 1.605c.467.807.7 1.21 1.015 1.453a2 2 0 0 0 1.479.396c.24-.032.483-.13.819-.308a1.617 1.617 0 0 1 1.567.008c.483.28.77.795.79 1.353c.014.38.05.64.143.863a2 2 0 0 0 1.083 1.083C10.602 22 11.068 22 12 22c.932 0 1.398 0 1.765-.152a2 2 0 0 0 1.083-1.083c.092-.223.129-.483.143-.863c.02-.558.307-1.074.79-1.353a1.617 1.617 0 0 1 1.567-.008c.336.178.579.276.819.308a2 2 0 0 0 1.479-.396c.315-.242.548-.646 1.014-1.453c.466-.807.7-1.21.751-1.605a2 2 0 0 0-.396-1.479c-.148-.192-.355-.353-.676-.555A1.617 1.617 0 0 1 19.562 12c0-.558.304-1.064.777-1.36c.321-.203.529-.364.676-.556a2 2 0 0 0 .396-1.479c-.052-.394-.285-.798-.75-1.605c-.467-.807-.7-1.21-1.015-1.453a2 2 0 0 0-1.479-.396c-.24.032-.483.13-.82.308a1.617 1.617 0 0 1-1.566-.008a1.617 1.617 0 0 1-.79-1.353c-.014-.38-.05-.64-.143-.863a2 2 0 0 0-1.083-1.083Z" />
                                        </g>
                                    </svg>Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item text-danger" (click)="logout()" routerLink="/register">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        class="mx-1">
                                        <g fill="none" stroke="currentColor" stroke-width="1.5">
                                            <path stroke-linecap="round"
                                                d="M8.002 7c.012-2.175.109-3.353.877-4.121C9.758 2 11.172 2 14 2h1c2.829 0 4.243 0 5.122.879C21 3.757 21 5.172 21 8v8c0 2.828 0 4.243-.878 5.121C19.242 22 17.829 22 15 22h-1c-2.828 0-4.242 0-5.121-.879c-.768-.768-.865-1.946-.877-4.121" />
                                            <path
                                                d="M8 19.5c-2.357 0-3.536 0-4.268-.732C3 18.035 3 16.857 3 14.5v-5c0-2.357 0-3.536.732-4.268C4.464 4.5 5.643 4.5 8 4.5" />
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M15 12H6m0 0l2 2m-2-2l2-2" />
                                        </g>
                                    </svg>
                                    Logout
                                </a>
                            </li>
                        </ul>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
