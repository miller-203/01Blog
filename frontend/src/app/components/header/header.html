<header class="app-header">
    <div class="container-fluid">
        <div class="row align-items-center py-1 justify-content-between">
            <!-- Logo Section -->
            <div class="col-auto">
                <a routerLink="/home" class="text-decoration-none">
                    <div class="brand-wrap">
                        <h1 class="logo-text">01Blog</h1>
                    </div>
                </a>
            </div>

            <!-- Actions Section -->
            <div class="col-auto">
                <div class="d-flex align-items-center gap-2">
                    <!-- Hamburger Menu for Mobile/Tablet -->
                    <button class="btn-hamburger d-lg-none" type="button" (click)="onToggleRightSidebar()" title="Open users sidebar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/>
                        </svg>
                    </button>
                    <button class="btn-hamburger d-lg-none" type="button" (click)="onToggleLeftSidebar()" title="Open navigation sidebar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M3 5h18v14H3zm2 2v10h14V7zm2 2h4v2H7zm0 4h4v2H7z"/>
                        </svg>
                    </button>

                    <!-- Notifications -->
                    <div class="notifications-dropdown position-relative">
                        <button class="btn-notifications position-relative" type="button" (click)="toggleNotifications($event)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path
                                        d="M18.75 9.71v-.705C18.75 5.136 15.726 2 12 2S5.25 5.136 5.25 9.005v.705a4.4 4.4 0 0 1-.692 2.375L3.45 13.81c-1.011 1.575-.239 3.716 1.52 4.214a25.775 25.775 0 0 0 14.06 0c1.759-.498 2.531-2.639 1.52-4.213l-1.108-1.725a4.4 4.4 0 0 1-.693-2.375Z" />
                                    <path stroke-linecap="round"
                                        d="M7.5 19c.655 1.748 2.422 3 4.5 3s3.845-1.252 4.5-3M12 6v4" />
                                </g>
                            </svg>
                            <span class="notification-dot" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
                        </button>

                        <div class="notifications-popup" *ngIf="isNotificationsOpen()" (click)="$event.stopPropagation()">
                            <div class="notifications-popup-header">
                                <h6>Recent notifications</h6>
                                <button class="mark-all-btn" type="button" (click)="toggleAllNotifications($event)">
                                    {{ allRead() ? 'all as unread' : 'all as read' }}
                                </button>
                            </div>

                            <div class="notifications-popup-body" *ngIf="!isLoadingNotifications(); else loadingTemplate">
                                <button
                                    class="notification-item"
                                    [class.unread]="!notification.read"
                                    *ngFor="let notification of visibleNotifications()"
                                    (click)="onNotificationClick(notification)">
                                    <img [src]="notification.actorAvatar" [alt]="notification.actorFirstName" />
                                    <div class="notification-item-content">
                                        <p>{{ notification.message }}</p>
                                        <small>{{ formatDate(notification.createdAt) }}</small>
                                    </div>
                                    <button
                                        class="notification-state-btn"
                                        type="button"
                                        (click)="toggleReadState($event, notification)">
                                        {{ notification.read ? 'Unread' : 'Read' }}
                                    </button>
                                </button>

                                <div class="empty-notifications" *ngIf="notifications().length === 0">
                                    No notifications yet.
                                </div>
                                <div class="text-center mt-2" *ngIf="visibleNotifications().length < notifications().length">
                                    <button class="mark-all-btn" type="button" (click)="loadMoreNotifications()">
                                        Load more
                                    </button>
                                </div>
                            </div>
                        </div>

                        <ng-template #loadingTemplate>
                            <div class="notifications-popup loading">Loading notifications...</div>
                        </ng-template>
                    </div>

                    <!-- Create Post Button -->
                    <a routerLink="/create-post" class="text-decoration-none">
                        <button class="btn btn-create d-flex align-items-center" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M3 11c0-3.771 0-5.657 1.172-6.828C5.343 3 7.229 3 11 3h2c3.771 0 5.657 0 6.828 1.172C21 5.343 21 7.229 21 11v2c0 3.771 0 5.657-1.172 6.828C18.657 21 16.771 21 13 21h-2c-3.771 0-5.657 0-6.828-1.172C3 18.657 3 16.771 3 13z" />
                                    <path stroke-linecap="square" stroke-linejoin="round" d="M12 8v8m4-4H8" />
                                </g>
                            </svg>
                            New Post
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
