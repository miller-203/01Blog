<div
  *ngIf="visible"
  class="toast-popup"
  role="status"
  aria-live="polite"
  [class.success]="type === 'success'"
  [class.error]="type === 'error'"
>
  <div class="toast-popup-icon" aria-hidden="true">
    <span *ngIf="type === 'success'">✓</span>
    <span *ngIf="type === 'error'">!</span>
  </div>

  <p class="toast-popup-message">{{ message }}</p>

  <div class="toast-popup-progress"></div>
</div>
