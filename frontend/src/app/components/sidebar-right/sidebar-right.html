<app-popup #popup></app-popup>

<aside class="sidebar py-4 px-3 sidebar-right">

    <div class="mb-3">
        <!-- Enhanced Header with Icon and Stats -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center">
            </div>

        </div>

        <!-- Enhanced Search Input -->
        <div class="search-container">
            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="24" height="24" viewBox="0 0 24 24">
                <g fill="none" stroke-width="1.5">
                    <circle cx="11.5" cy="11.5" r="9.5" />
                    <path stroke-linecap="round" d="m20 20l2 2" />
                </g>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search by Username..."
                [(ngModel)]="searchQuery" (input)="onSearchInput($event)" />
            <div id="searchSpinner" class="search-spinner" [class.d-none]="!isSearching"></div>
        </div>
    </div>

    <!-- Enhanced Users List -->
    <div class="users-list">
        <ng-container *ngIf="users.length === 0 && !isSearching">
            <div class="no-results">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m8 12l2-1.5L8 9m8 3l-2-1.5L16 9m0 7l-1.333-1l-1.334 1L12 15l-1.333 1l-1.334-1L8 16" />
                    </g>
                </svg>
                <p>No users found.</p>
            </div>
        </ng-container>
        <ng-container *ngIf="isSearching">
            <div class="searching">
                <p>Searching...</p>
            </div>
        </ng-container>
        <a *ngFor="let user of displayedUsers" [href]="'/profile/' + user.username" class="user-item">
            <div class="user-avatar">
                <img [src]="user.avatarUrl || '/assets/avatar-placeholder.png'" [alt]="user.firstName">
            </div>
            <div class="flex-fill ms-3">
                <h3 class="name">{{ user.firstName }} {{ user.lastName }}</h3>
                <div class="user-name">@{{ user.username }}</div>
            </div>
            <!-- <button class="btn btn-sm btn-outline-primary" (click)="toggleFollow(user, $event)" [disabled]="followActionInProgress.has(user.id.toString())">
                {{ followingUserIds.has(user.id.toString()) ? 'Unfollow' : 'Follow' }}
            </button> -->
            <button class="follow-btn" (click)="toggleFollow(user, $event)" [disabled]="followActionInProgress.has(user.id.toString())">
                <!-- <i class="fas fa-user-plus" *ngIf="!isFollowing"></i>
                <i class="fas fa-user-check" *ngIf="isFollowing"></i> -->
                {{ isFollowing(user) ? 'Unfollow' : 'Follow' }}
            </button>
        </a>
        <div class="text-center mt-3" *ngIf="displayedUsers.length < users.length">
            <button class="follow-btn" type="button" (click)="loadMoreUsers()">Load more</button>
        </div>
    </div>

</aside>
