<aside class="sidebar py-4 px-3 sidebar-right">

    <div class="mb-3">
        <!-- Enhanced Header with Icon and Stats -->
        <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center">
                <div class="header-icon me-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="6" r="4" />
                            <path stroke-linecap="round"
                                d="M18 9c1.657 0 3-1.12 3-2.5S19.657 4 18 4M6 9C4.343 9 3 7.88 3 6.5S4.343 4 6 4" />
                            <ellipse cx="12" cy="17" rx="6" ry="4" />
                            <path stroke-linecap="round"
                                d="M20 19c1.754-.385 3-1.359 3-2.5s-1.246-2.115-3-2.5M4 19c-1.754-.385-3-1.359-3-2.5s1.246-2.115 3-2.5" />
                        </g>
                    </svg>
                </div>
                <div class="header-title">
                    <h5 class="mt-2 fs-6">Discover</h5>
                </div>
            </div>
            <div class="d-flex align-items-center">
                <button class="refresh-btn" title="Refresh">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Enhanced Search Input -->
        <div class="search-container">
            <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="24" height="24" viewBox="0 0 24 24">
                <g fill="none" stroke-width="1.5">
                    <circle cx="11.5" cy="11.5" r="9.5" />
                    <path stroke-linecap="round" d="m20 20l2 2" />
                </g>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search by Username..."
                [(ngModel)]="searchQuery" (input)="onSearchInput($event)" />
            <div id="searchSpinner" class="search-spinner" [class.d-none]="!isSearching"></div>
        </div>
    </div>

    <!-- Enhanced Users List -->
    <div class="users-list">
        <ng-container *ngIf="users.length === 0 && !isSearching">
            <div class="no-results">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m8 12l2-1.5L8 9m8 3l-2-1.5L16 9m0 7l-1.333-1l-1.334 1L12 15l-1.333 1l-1.334-1L8 16" />
                    </g>
                </svg>
                <p>No users found.</p>
            </div>
        </ng-container>
        <ng-container *ngIf="isSearching">
            <div class="searching">
                <p>Searching...</p>
            </div>
        </ng-container>
        <a *ngFor="let user of users" [href]="'/profile/' + user.username" class="user-item">
            <div class="user-avatar">
                <img [src]="user.avatarUrl" [alt]="user.firstName">
            </div>
            <div class="flex-fill ms-3">
                <h3 class="name">{{ user.firstName }} {{ user.lastName }}</h3>
                <div class="user-name">@{{ user.username }}</div>
            </div>
                        <button class="btn btn-sm btn-outline-primary" (click)="toggleFollow(user, $event)">
                {{ followingUserIds.has(user.id) ? 'Unfollow' : 'Follow' }}
            </button>
        </a>
    </div>

</aside>
