<div class="admin-posts-page">
    <app-popup #popup></app-popup>
    <!-- Search Section -->
    <div class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" placeholder=" Search by author name..."
                (input)="onSearch($event)" />
        </div>
    </div>

    <!-- Posts Table -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="table posts-table mb-0">
                <thead>
                    <tr>
                        <th>Author</th>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Likes</th>
                        <th>Comments</th>
                        <th>Reports</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let post of displayedPosts"
                        [class.reported-row]="post.reportsCount && post.reportsCount > 0">
                        <td>
                            <a [href]="'/profile/' + post.authorUsername" class="author-link">@{{ post.authorUsername
                                }}</a>
                        </td>
                        <td>
                            <span class="content-preview">
                                {{ post.title }}
                            </span>
                        </td>
                        <td>{{ post.createdAt ? formatDate(post.createdAt) : '' }}</td>
                        <td><span class="stat-number">{{ post.likesCount || 0 }}</span></td>
                        <td><span class="stat-number">{{ post.commentsCount || 0 }}</span></td>
                        <td>
                            <span class="reports-badge"
                                [class]="(post.reportsCount && post.reportsCount > 0) ? 'danger' : 'zero'">{{
                                post.reportsCount || 0 }}</span>
                        </td>
                        <td class="text-end">
                            <a [routerLink]="['/posts', post.id]" class="text-decoration-none">
                                <button class="btn action-btn btn-view me-1"> View </button>
                            </a>
                            <button class="btn action-btn btn-delete" (click)="deletePost(post)"> Delete </button>
                            <button class="btn action-btn btn-hide" (click)="togglePostVisibility(post)"> {{ post.hidden ? 'Unhide' : 'Hide' }} </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Load More Button -->
    <div class="load-more-wrapper">
        <button class="btn btn-primary" (click)="loadMore()">Load More (+10)</button>
    </div>

    <!-- Confirm Delete Popup -->
    <app-confirm-delete-popup [show]="showDeletePopup" [item]="postToDelete" title="Delete Post"
        message="Are you sure you want to delete this post? This action cannot be undone."
        (confirm)="confirmDeletePost()" (cancel)="cancelDeletePost()">
    </app-confirm-delete-popup>
</div>
