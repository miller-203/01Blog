<div class="container py-4">
  <div class="row g-3 align-items-stretch" *ngIf="status">

    <!-- Total Users -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- user icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
              viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="6" r="4" />
                <path stroke-linecap="round"
                  d="M18 9c1.657 0 3-1.12 3-2.5S19.657 4 18 4M6 9C4.343 9 3 7.88 3 6.5S4.343 4 6 4"
                  opacity=".5" />
                <ellipse cx="12" cy="17" rx="6" ry="4" />
                <path stroke-linecap="round"
                  d="M20 19c1.754-.385 3-1.359 3-2.5s-1.246-2.115-3-2.5M4 19c-1.754-.385-3-1.359-3-2.5s1.246-2.115 3-2.5"
                  opacity=".5" />
              </g>
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Total Users</h6>
              <small class="text-muted">All time</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0" data-value="12,345">{{status.totalUsers}}</h2>
              <span class="ms-2 badge text-bg-dark">Active</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Active, verified accounts.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Total Posts -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- post icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
              viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-width="1.5">
                <path
                  d="M5 11.5c0-1.886 0-2.828.586-3.414C6.172 7.5 7.114 7.5 9 7.5h6c1.886 0 2.828 0 3.414.586C19 8.672 19 9.614 19 11.5v1c0 1.886 0 2.828-.586 3.414c-.586.586-1.528.586-3.414.586H9c-1.886 0-2.828 0-3.414-.586C5 15.328 5 14.386 5 12.5v-1Z" />
                <path stroke-linecap="round"
                  d="M19 2v.5A2.5 2.5 0 0 1 16.5 5h-9A2.5 2.5 0 0 1 5 2.5V2m14 20v-.5a2.5 2.5 0 0 0-2.5-2.5h-9A2.5 2.5 0 0 0 5 21.5v.5"
                  opacity=".5" />
              </g>
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Total Posts</h6>
              <small class="text-muted">All time</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0" data-value="48,712">{{status.totalPosts}}</h2>
              <span class="ms-2 badge bg-black">new</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Published & draft posts
              combined.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Pending Reports -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card stat-card h-100 shadow-sm">
        <div class="card-body d-flex">
          <div class="stat-icon me-3">
            <!-- alert/report icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
              viewBox="0 0 48 48">
              <g fill="none" stroke="currentColor" stroke-linejoin="round"
                stroke-width="4">
                <path
                  d="M36 35H12V21c0-6.627 5.373-12 12-12s12 5.373 12 12v14Z" />
                <path stroke-linecap="round"
                  d="M8 42h32M4 13l3 1m6-10l1 3m-4 3L7 7" />
              </g>
            </svg>
          </div>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <h6 class="mb-1">Pending Reports</h6>
              <small class="text-muted">Needs review</small>
            </div>
            <div class="d-flex align-items-center">
              <h2 class="stat-number mb-0 text-warning" data-value="27">{{status.totalPendingReports}}</h2>
              <span class="ms-2 badge bg-danger">urgent</span>
            </div>
            <p class="text-muted small mb-0 mt-2">Reports waiting action
              (ban/dismiss).</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
