<!-- home.component.html -->
<div class="profile-container d-flex" *ngIf="user">
    <app-popup #popup></app-popup>

    <!-- Main Content -->
    <main class="main-content pt-4">
        <div class="content-wrapper">
            <div class="container">
                <div class="cover-photo" [style.background-image]="(user as any).coverUrl ? 'url(' + (user as any).coverUrl + ' )' : null"></div>
                <div class="profile-image-wrapper">
                    <div class="profile-image">
                        <img src="{{user.avatarUrl}}" alt="Profile image">
                    </div>
                </div>
                <div class="profile-content">
                    <!-- THREE DOTS MENU -->
                    <div class="profile-actions">
                        <button class="dots-menu-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"
                                (click)="onMenuKlick()">
                                <path fill="currentColor"
                                    d="M128 96a32 32 0 1 0 32 32a32 32 0 0 0-32-32Zm0 48a16 16 0 1 1 16-16a16 16 0 0 1-16 16Zm0-64a32 32 0 1 0-32-32a32 32 0 0 0 32 32Zm0-48a16 16 0 1 1-16 16a16 16 0 0 1 16-16Zm0 144a32 32 0 1 0 32 32a32 32 0 0 0-32-32Zm0 48a16 16 0 1 1 16-16a16 16 0 0 1-16 16Z" />
                            </svg>
                        </button>
                        <div class="dots-menu" *ngIf="showMenu">
                            <div class="dots-menu-item" *ngIf="false" (click)="onShareClick()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                                        <path
                                            d="M22 13.998c-.029 3.414-.218 5.296-1.46 6.537C19.076 22 16.718 22 12.003 22c-4.716 0-7.073 0-8.538-1.465C2 19.07 2 16.713 2 11.997C2 7.282 2 4.924 3.465 3.46C4.706 2.218 6.588 2.029 10.002 2" />
                                        <path stroke-linejoin="round"
                                            d="M22 7h-8c-1.818 0-2.913.892-3.32 1.3c-.125.127-.188.19-.19.19c0 .002-.063.065-.19.19C9.892 9.087 9 10.182 9 12v3m13-8l-5-5m5 5l-5 5" />
                                    </g>
                                </svg>
                                <span>Share Profile</span>
                            </div>
                            <div class="dots-menu-item text-danger" *ngIf="!user.currentUser" (click)="onReportClick()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                                    <g fill="none">
                                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
                                        <path stroke="currentColor" stroke-linecap="round" stroke-width="1.5"
                                            d="M12 7v6" />
                                        <circle cx="12" cy="16" r="1" fill="currentColor" />
                                    </g>
                                </svg>
                                <span>Report</span>
                            </div>
                        </div>
                    </div>

                    <h1 class="profile-name">{{user.firstName + " " + user.lastName}}</h1>
                    <p class="profile-username">{{ "@" + user.username }}</p>
                    <p class="profile-bio">
                        {{ user.bio }}
                    </p>
                    <div class="stats-container">
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followersCount }}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.followingCount }}</span>
                            <span class="stat-label">Following</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">{{ user.postsCount }}</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>
                    <button *ngIf="user.currentUser" class="follow-btn" (click)="onEditProfile()">
                        <i class="fas fa-edit"></i> Edit Profile
                    </button>
                    <div></div>
                    <button *ngIf="!user.currentUser" class="follow-btn" (click)="onFollowClick()"
                        [disabled]="isLoading">
                        <i class="fas fa-user-plus" *ngIf="!isFollowing"></i>
                        <i class="fas fa-user-check" *ngIf="isFollowing"></i>
                        {{ isFollowing ? 'Unfollow' : 'Follow' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Posts Section -->

        <div class="content-wrapper">

            <app-post-card *ngFor="let post of posts" [post]="post"></app-post-card>

        </div>

    </main>


    <!-- EDIT PROFILE POPUP -->
    <div class="edit-profile-popup" *ngIf="showEditPopup">
        <div class="popup-backdrop" (click)="closeEditPopup()"></div>
        <div class="popup-content">
            <h2>Edit Profile</h2>
            <form (ngSubmit)="submitEditProfile()">
                <div class="form-group">
                    <label for="avatar">Profile Picture</label>

                    <!-- Hidden file input -->
                    <input type="file" id="avatar" (change)="onAvatarChange($event)" name="avatar" accept="image/*"
                        #fileInput style="display: none;">

                    <!-- Clickable avatar preview -->
                    <div class="avatar-upload" (click)="fileInput.click()">
                        <img *ngIf="editForm.avatarPreview; else placeholder" [src]="editForm.avatarPreview"
                            alt="Avatar preview">

                        <ng-template #placeholder>
                            <div class="avatar-placeholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z" />
                                    <path d="M12 14c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z" />
                                </svg>
                                <span>Click to upload</span>
                            </div>
                        </ng-template>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cover">Cover Photo</label>
                    <input type="file" id="cover" (change)="onCoverChange($event)" name="cover" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input id="firstName" [(ngModel)]="editForm.firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" [(ngModel)]="editForm.lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" [(ngModel)]="editForm.bio" name="bio"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" (click)="closeEditPopup()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- REPORT PROFILE POPUP -->
    <app-report-user-popup [show]="showReportPopup" [reason]="reportForm.reason"
        (reasonChange)="reportForm.reason = $event" (close)="closeReportPopup()" (submit)="submitReportUser()">
    </app-report-user-popup>



    <!-- Right Sidebar -->
</div>
