<!-- home.component.html -->
<div class="home-container d-flex">
    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            <div class="pills-header">
                <h1 class="header-title">Saved Posts</h1>
                <div class="category-pills">
                    <div class="pill active">All Posts</div>
                </div>
            </div>

            <div class="posts-grid" *ngIf="!isLoading">
                <app-post-card *ngFor="let post of savedPosts" [post]="post"></app-post-card>
            </div>

            <div *ngIf="isLoading" class="loading">
                <p>Loading saved posts...</p>
            </div>

            <div *ngIf="!isLoading && savedPosts.length === 0" class="no-posts">
                <p>No saved posts yet.</p>
            </div>
        </div>
    </main>

    <!-- Right Sidebar -->
    <app-sidebar-right></app-sidebar-right>
</div>
