<div class="login-page d-flex justify-content-center align-items-center min-vh-100 py-4">
  <app-popup #popup></app-popup>

  <div class="login-card register-card">
    <div class="d-flex align-items-center mb-2">
      <div class="logo-circle d-flex align-items-center justify-content-center">
        <div class="logo-inner"></div>
      </div>
      <h1 class="logo-text">01Blog</h1>
    </div>

    <p class="subtitle mb-4">Create your account</p>

    <form (ngSubmit)="onSubmit()">
      <div class="row gx-3">
        <div class="col-sm-6 form-group mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="form-control"
            [(ngModel)]="userRegister.firstName"
            placeholder="John"
            required
          >
        </div>

        <div class="col-sm-6 form-group mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="form-control"
            [(ngModel)]="userRegister.lastName"
            placeholder="Doe"
            required
          >
        </div>
      </div>

      <div class="form-group mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          [(ngModel)]="userRegister.username"
          placeholder="yourname"
          required
        >
      </div>

      <div class="form-group mb-3">
        <label for="email" class="form-label">E-Mail</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="userRegister.email"
          placeholder="yourname@gmail.com"
          required
        >
      </div>

      <div class="form-group mb-3">
        <label for="bio" class="form-label">Bio (optional)</label>
        <textarea
          id="bio"
          name="bio"
          class="form-control"
          rows="2"
          [(ngModel)]="userRegister.bio"
          placeholder="Tell people a bit about yourself"
        ></textarea>
      </div>

      <div class="form-group mb-3">
        <label for="avatar" class="form-label">Avatar (optional)</label>
        <input
          type="file"
          id="avatar"
          name="avatar"
          class="form-control"
          accept="image/*"
          (change)="onAvatarSelected($event)"
        >
      </div>

      <div class="form-group mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="password-wrapper">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-control"
            [(ngModel)]="userRegister.password"
            placeholder="••••••••••••"
            required
          >
          <button type="button" class="eye-icon" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isSubmitting" class="btn-primary-custom d-flex align-items-center justify-content-center mb-3">
        <span *ngIf="!isSubmitting">Sign Up</span>
        <span *ngIf="isSubmitting" class="spinner"></span>
      </button>
    </form>

    <p class="signup-text text-center mb-0">
      Already have an account?
      <a routerLink="/login" class="text-black fw-semibold text-decoration-none">Sign In</a>
    </p>
  </div>
</div>
