<div class="login-page d-flex justify-content-center align-items-center min-vh-100 py-4">
  <app-popup #popup></app-popup>

  <div class="login-card split-layout">
    <section class="info-panel">
      <div class="headline-box">
        <h2 class="info-title">Start Your <em>Blogging</em> Journey</h2>
      </div>

      <p class="info-description">
        Discover your unique voice. Connect with an audience who values your perspective.
        Shape a meaningful career doing what you love. Learn, share, and grow with us.
      </p>
    </section>

    <section class="form-panel">
      <div class="brand-wrap">
        <div class="logo-circle" aria-hidden="true"></div>
        <h1 class="logo-text">01Blog</h1>
      </div>

      <p class="subtitle">Your story starts here</p>

      <form id="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="userLogin.username"
            id="username"
            name="username"
            placeholder="yourname@gmail.com"
            required
          >
        </div>

        <div class="form-group password-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              id="password"
              name="password"
              class="form-control"
              [(ngModel)]="userLogin.password"
              placeholder="••••••••••••"
              required
            >
            <button type="button" class="eye-icon" (click)="togglePassword()" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="isSubmitting" class="btn-primary-custom d-flex align-items-center justify-content-center">
          <span *ngIf="!isSubmitting">Sign In</span>
          <span *ngIf="isSubmitting" class="spinner"></span>
        </button>
      </form>

      <p class="signup-text text-center mb-0">
        Don't have an account?
        <a routerLink="/register" class="text-black fw-semibold text-decoration-none">Sign Up</a>
      </p>
    </section>
  </div>
</div>
