<app-header (toggleSidebar)="toggleSidebar()"></app-header>
<main class="main-container d-flex">
    <app-sidebar-right *ngIf="showUsersSidebar()" [isOpenInput]="isSidebarOpen()"></app-sidebar-right>

    <section class="content-area">
        <router-outlet></router-outlet>
    </section>

    <app-sidebar-left></app-sidebar-left>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" *ngIf="showUsersSidebar() && isSidebarOpen() && isMobile()" (click)="closeSidebar()"></div>
</main>
