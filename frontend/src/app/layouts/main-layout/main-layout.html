<app-header (toggleSidebar)="toggleSidebar()"></app-header>
<main class="main-container d-flex">
    <app-sidebar-left *ngIf="showNavSidebar()" [isOpenInput]="isSidebarOpen()"></app-sidebar-left>

    <section class="content-area">
        <router-outlet></router-outlet>
    </section>

    <app-sidebar-right *ngIf="showRightSidebar()"></app-sidebar-right>
    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" *ngIf="showNavSidebar() && isSidebarOpen() && isMobile()" (click)="closeSidebar()"></div>
</main>
